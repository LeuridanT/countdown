<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homecoming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="hearts-container">
        <div class="heart left" id="heartLeft">♥</div>
        <div class="heart right" id="heartRight">♥</div>
    </div>

    <div class="container">
        <div class="ornament top-left" id="ornament1">†</div>
        <div class="ornament top-right" id="ornament2">†</div>
        
        <h1>Until February 7</h1>
        <div class="countdown">
            <div class="time-unit">
                <span id="days">00</span>
                <label>Days</label>
            </div>
            <div class="time-unit">
                <span id="hours">00</span>
                <label>Hours</label>
            </div>
            <div class="time-unit">
                <span id="minutes">00</span>
                <label>Minutes</label>
            </div>
        </div>
        <div class="message" id="message">At last, they are united.</div>

        <button class="letter-btn" id="letterBtn">Open the letter</button>
        
        <div class="letter" id="letter">
            <div class="letter-inner">
                <p class="letter-greeting">My love,</p>
                <p>I love you</p>
                <p>So much.</p>
                <p class="letter-signature">Forever yours</p>
                <button class="close-letter" id="closeLetter">Close</button>
            </div>
        </div>
    </div>

    <div class="whisper" id="whisper"></div>
    <div class="secret" id="secret">You are the best</div>

    <script src="script.js"></script>
</body>
</html>
